name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: travelrag
          POSTGRES_PASSWORD: travelrag
          POSTGRES_DB: travelrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U travelrag -d travelrag_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TRAVELRAG_TEST_DATABASE_URL: postgresql+psycopg://travelrag:travelrag@localhost:5432/travelrag_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
