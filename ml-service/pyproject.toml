[project]
name = "ml-service"
version = "0.1.0"
description = "Local model server for RAG-traveling: embeddings, reranking, ASR, OCR"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "huggingface-hub>=0.25",
    "numpy>=2.0",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "torch>=2.5",
    "transformers>=4.46",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_service"]
